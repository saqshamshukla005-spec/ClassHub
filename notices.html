<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.notice-box{
padding:40px;
}

.notice-card{
background:white;
padding:25px;
margin:20px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.notice-card h3{
color:#0d6efd;
}

</style>

</head>


<body>

<header>

<h1>📢 ClassHub Notices</h1>

</header>


<div class="notice-box">

<h2>Latest Notices</h2>


<div class="notice-card">

<h3>Semester Classes</h3>

<p>All students are informed that regular classes will start from Monday.</p>

</div>


<div class="notice-card">

<h3>Assignment Submission</h3>

<p>Submit your assignments before the last date.</p>

</div>


<div class="notice-card">

<h3>CR-DC Announcement</h3>

<p>CR-DC meeting will be held this week.</p>

</div>


</div>


</body>

</html>
