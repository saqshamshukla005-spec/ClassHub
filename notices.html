<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fc;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.notice{
background:#eef4ff;
padding:15px;
margin:15px 0;
border-radius:10px;
border-left:5px solid #0d6efd;
}

.notice h3{
margin:0;
color:#0d6efd;
}

.notice p{
margin-top:10px;
line-height:1.6;
}

.empty{
text-align:center;
padding:40px;
color:gray;
font-size:18px;
}

</style>

</head>

<body>

<header>

<h1>📢 Class Notices</h1>

</header>

<div class="container">

<h2>Latest Notices</h2>

<div id="noticeList"></div>

</div>

<script>

let notices = JSON.parse(localStorage.getItem("notices")) || [];

let html = "";

if(notices.length==0){

html = "<div class='empty'>No Notices Available</div>";

}else{

notices.forEach(n=>{

html += `

<div class="notice">

<h3>${n.title}</h3>

<p>${n.message}</p>

</div>

`;

});

}

document.getElementById("noticeList").innerHTML = html;

</script>

</body>
</html>
