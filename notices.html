<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.notice-box{
padding:40px;
}

.notice-card{

background:white;
padding:20px;
margin:15px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.notice-card h3{

color:#0d6efd;

}

</style>

</head>


<body>


<header>

<h1>📢 ClassHub Notices</h1>

</header>



<div class="notice-box">

<h2>Latest Notices</h2>


<div id="noticeList"></div>


</div>



<script>


function loadNotices(){


let notices = JSON.parse(localStorage.getItem("notices")) || [];


let list = document.getElementById("noticeList");


list.innerHTML="";


if(notices.length==0){


list.innerHTML = `

<div class="notice-card">

<p>No notices available.</p>

</div>

`;


return;

}



notices.forEach(n=>{


list.innerHTML += `

<div class="notice-card">

<h3>${n.title}</h3>

<p>${n.message}</p>

</div>

`;


});


}



loadNotices();



</script>


</body>

</html>
