<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.event-box{
padding:40px;
}

.event-card{

background:white;
padding:25px;
margin:20px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.event-card h3{

color:#0d6efd;

}

</style>

</head>


<body>


<header>

<h1>🎉 ClassHub Events</h1>

</header>


<div class="event-box">

<h2>Upcoming Events</h2>

<div id="eventList"></div>


</div>



<script>


function loadEvents(){


let events = JSON.parse(localStorage.getItem("events")) || [];


let list=document.getElementById("eventList");


list.innerHTML="";


if(events.length==0){

list.innerHTML=`

<div class="event-card">

<p>No events available.</p>

</div>

`;

return;

}



events.forEach(e=>{


list.innerHTML += `

<div class="event-card">

<h3>${e.title}</h3>

<p>📅 ${e.date}</p>

<p>${e.description}</p>

</div>

`;

});


}



loadEvents();


</script>


</body>

</html>
