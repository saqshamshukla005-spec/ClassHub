<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.profile-box{

max-width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
text-align:center;

}

.profile-box h2{

color:#0d6efd;

}

.info{

text-align:left;
margin-top:25px;

}

.info p{

padding:10px;
border-bottom:1px solid #ddd;

}

</style>

</head>


<body>


<header>

<h1>👤 Student Profile</h1>

</header>


<div class="profile-box">


<h2 id="studentName"></h2>


<div class="info">

<p>🆔 Student ID: <span id="studentId"></span></p>

<p>🏫 Department: Computer Science</p>

<p>🎓 Course: Diploma CSE</p>

<p>📚 Semester: 2nd Semester</p>

</div>


</div>



<script>

let id = localStorage.getItem("studentId");


if(id){

document.getElementById("studentName").innerHTML =
"Welcome Student";

document.getElementById("studentId").innerHTML=id;

}

else{

window.location.href="student-login.html";

}


</script>


</body>

</html>
