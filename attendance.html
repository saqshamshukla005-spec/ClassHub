<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.attendance-box{
padding:40px;
}

.attendance-card{

background:white;
padding:25px;
margin:20px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.progress{

background:#ddd;
height:20px;
border-radius:10px;
overflow:hidden;

}

.progress span{

display:block;
height:100%;
background:#0d6efd;
width:85%;

}

</style>

</head>


<body>


<header>

<h1>📊 Student Attendance</h1>

</header>



<div class="attendance-box">


<h2>Your Attendance</h2>


<div class="attendance-card">

<h3>Computer Science</h3>

<p>Attendance: 85%</p>

<div class="progress">

<span></span>

</div>

</div>



<div class="attendance-card">

<h3>Mathematics</h3>

<p>Attendance: 90%</p>

<div class="progress">

<span style="width:90%"></span>

</div>

</div>



<div class="attendance-card">

<h3>Electronics</h3>

<p>Attendance: 78%</p>

<div class="progress">

<span style="width:78%"></span>

</div>

</div>



</div>


</body>

</html>
