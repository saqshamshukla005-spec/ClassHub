<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.notes-box{
padding:40px;
}

.note-card{

background:white;
padding:25px;
margin:20px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,1,.12);

}

.note-card h3{

color:#0d6efd;

}

.note-card a{

display:inline-block;
margin-top:10px;
background:#0d6efd;
color:white;
padding:10px 20px;
border-radius:6px;
text-decoration:none;

}

</style>

</head>


<body>


<header>

<h1>📚 ClassHub Notes</h1>

</header>



<div class="notes-box">


<h2>Available Notes</h2>


<div id="noteList"></div>


</div>



<script>


function loadNotes(){


let notes = JSON.parse(localStorage.getItem("notes")) || [];


let list=document.getElementById("noteList");


list.innerHTML="";


if(notes.length==0){

list.innerHTML=`

<div class="note-card">

<p>No notes available.</p>

</div>

`;

return;

}



notes.forEach(n=>{


list.innerHTML += `

<div class="note-card">

<h3>${n.subject}</h3>

<p>${n.title}</p>


<a href="${n.link}" target="_blank">

Open Note

</a>


</div>

`;

});


}


loadNotes();


</script>



</body>

</html>
