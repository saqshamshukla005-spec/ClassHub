<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Events | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fc;
margin:0;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.event{
background:#eef4ff;
padding:15px;
margin-top:15px;
border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>📅 Manage Events</h1>
</header>

<div class="container">

<input id="title" placeholder="Event Name">

<input id="date" type="date">

<textarea id="description" placeholder="Description"></textarea>

<button onclick="addEvent()">
Add Event
</button>

<hr>

<div id="eventList"></div>

</div>

<script>

let events=JSON.parse(localStorage.getItem("events"))||[];

function load(){

let html="";

events.forEach((e,i)=>{

html+=`
<div class="event">
<h3>${e.title}</h3>
<p>📅 ${e.date}</p>
<p>${e.description}</p>
<button onclick="removeEvent(${i})">Delete</button>
</div>
`;

});

document.getElementById("eventList").innerHTML=html;

}

function addEvent(){

let title=document.getElementById("title").value;
let date=document.getElementById("date").value;
let description=document.getElementById("description").value;

if(title==""||date==""){

alert("Fill all fields");

return;

}

events.unshift({

title,
date,
description

});

localStorage.setItem("events",JSON.stringify(events));

load();

}

function removeEvent(i){

events.splice(i,1);

localStorage.setItem("events",JSON.stringify(events));

load();

}

load();

</script>

</body>
</html>
