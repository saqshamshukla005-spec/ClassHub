<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f7fc;
margin:0;
font-family:Arial,sans-serif;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.dashboard{
padding:30px;
}

#welcome{
text-align:center;
margin-bottom:30px;
color:#0d6efd;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
text-align:center;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-top:15px;
}

.logout{
margin-top:40px;
text-align:center;
}

.logout button{
background:red;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>

<header>

<h1>🎓 Student Dashboard</h1>

</header>

<div class="dashboard">

<h2 id="welcome"></h2>

<div class="grid">

<div class="card">
📚
<h3>Notes</h3>
</div>

<div class="card">
📢
<h3>Notices</h3>
</div>

<div class="card">
📅
<h3>Events</h3>
</div>

<div class="card">
📊
<h3>Attendance</h3>
</div>

<div class="card">
📝
<h3>Results</h3>
</div>

<div class="card">
👤
<h3>Profile</h3>
</div>

</div>

<div class="logout">

<button onclick="logout()">

Logout

</button>

</div>

</div>

<script>

let studentId=localStorage.getItem("studentId");

if(studentId){

document.getElementById("welcome").innerHTML="Welcome, "+studentId;

}else{

window.location.href="student-login.html";

}

function logout(){

localStorage.removeItem("studentId");

window.location.href="student-login.html";

}

</script>

</body>
</html>
