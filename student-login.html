<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:380px;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
text-align:center;
}

.login-box h1{
color:#0d6efd;
margin-bottom:10px;
}

.login-box p{
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.login-box button{
width:100%;
padding:12px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

.login-box button:hover{
background:#084298;
}
</style>

</head>

<body>

<div class="login-box">

<h1>🎓 Student Login</h1>

<p>Enter your Student ID</p>

<input
type="text"
id="studentId"
placeholder="Student ID">

<button onclick="loginStudent()">
Login
</button>

</div>

<script>

function loginStudent(){

let id=document.getElementById("studentId").value.trim();

if(id==""){

alert("Please enter your Student ID");

return;

}

localStorage.setItem("studentId",id);

window.location.href="student-dashboard.html";

}

</script>

</body>
</html>
