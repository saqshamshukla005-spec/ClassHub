<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>
.login-box{
width:350px;
margin:80px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
text-align:center;
}

.login-box input{
width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.login-box button{
width:100%;
padding:12px;
background:#1565C0;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.login-box button:hover{
background:#0d47a1;
}
</style>

</head>

<body>

<div class="login-box">

<h2>🎓 Student Login</h2>

<p>Enter your Student ID</p>

<input
type="text"
id="studentId"
placeholder="Student ID">

<button onclick="loginStudent()">

Login

</button>

</div>

<script>

function loginStudent(){

let id=document.getElementById("studentId").value;

if(id==""){

alert("Please enter Student ID");

}

else{

alert("Welcome Student : "+id);

// Dashboard baad me connect karenge

}

}

</script>

</body>

</html>
