<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CR-DC Admin Dashboard | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f7fc;
}

.admin-dashboard{
padding:40px;
}

.admin-dashboard h2{
text-align:center;
color:#0d6efd;
margin-bottom:30px;
}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}

.card{

background:white;
padding:30px;
border-radius:12px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.12);
transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card a{

text-decoration:none;
color:#333;

}

.icon{

font-size:40px;

}

.logout{

text-align:center;
margin-top:40px;

}

.logout button{

background:red;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;

}

</style>

</head>


<body>


<header>

<h1>👔 CR-DC / Admin Dashboard</h1>

</header>



<div class="admin-dashboard">


<h2>Welcome CR-DC Admin</h2>



<div class="grid">


<div class="card">

<a href="manage-notices.html">

<div class="icon">📢</div>

<h3>Manage Notices</h3>

</a>

</div>



<div class="card">

<a href="manage-notes.html">

<div class="icon">📚</div>

<h3>Manage Notes</h3>

</a>

</div>



<div class="card">

<a href="#">

<div class="icon">📅</div>

<h3>Manage Events</h3>

</a>

</div>



<div class="card">

<a href="#">

<div class="icon">👨‍🎓</div>

<h3>Students</h3>

</a>

</div>



<div class="card">

<a href="#">

<div class="icon">👨‍🏫</div>

<h3>Teachers</h3>

</a>

</div>



<div class="card">

<a href="#">

<div class="icon">⚙️</div>

<h3>Settings</h3>

</a>

</div>



</div>


<div class="logout">

<button onclick="logout()">

Logout

</button>

</div>


</div>



<script>

function logout(){

window.location.href="admin-login.html";

}

</script>



</body>

</html>
