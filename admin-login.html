<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR-DC / Admin Login</title>

<link rel="stylesheet" href="style.css">

<style>
.login-box{
max-width:400px;
margin:80px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

.login-box button{
width:100%;
padding:12px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="login-box">

<h2>👔 CR-DC / Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="adminLogin()">

Login

</button>

</div>

<script>

function adminLogin(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user=="" || pass==""){

alert("Please enter Username and Password");

}

else{

window.location.href="admin-dashboard.html";

}

}

</script>

</body>
</html>
