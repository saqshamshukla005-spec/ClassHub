<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CR-DC / Admin Login | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

width:400px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.login-box h1{

text-align:center;
color:#0d6efd;
margin-bottom:10px;

}

.login-box p{

text-align:center;
margin-bottom:20px;
color:#555;

}

.login-box input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}

.login-box button{

width:100%;
padding:12px;
margin-top:15px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

.login-box button:hover{

background:#084298;

}

</style>

</head>

<body>

<div class="login-box">

<h1>👔 CR-DC / Admin Login</h1>

<p>Login using your Admin Credentials</p>

<input
type="text"
id="username"
placeholder="Admin Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="loginAdmin()">

Login

</button>

</div>

<script>

function loginAdmin(){

let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value.trim();

if(username==="" || password===""){

alert("Please enter Username and Password");

return;

}

/* Temporary Admin Login */

if(username==="admin" && password==="admin123"){

localStorage.setItem("admin","true");

window.location.href="admin-dashboard.html";

}

else{

alert("Invalid Username or Password");

}

}

</script>

</body>
</html>
