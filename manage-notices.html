<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fc;
}

header{
background:#0d6efd;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#0d6efd;
color:#fff;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#084298;
}

.notice{
background:#eef4ff;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.delete{
background:red;
margin-top:10px;
}

</style>

</head>

<body>

<header>

<h1>📢 Manage Notices</h1>

</header>

<div class="container">

<h2>Add Notice</h2>

<input
type="text"
id="title"
placeholder="Notice Title">

<textarea
id="message"
rows="5"
placeholder="Notice Description"></textarea>

<button onclick="addNotice()">

Add Notice

</button>

<hr>

<h2>All Notices</h2>

<div id="noticeList"></div>

</div>

<script>

let notices=JSON.parse(localStorage.getItem("notices"))||[];

function showNotices(){

let html="";

if(notices.length===0){

html="<p>No Notice Available.</p>";

}

else{

notices.forEach((n,index)=>{

html+=`

<div class="notice">

<h3>${n.title}</h3>

<p>${n.message}</p>

<button class="delete" onclick="deleteNotice(${index})">

Delete

</button>

</div>

`;

});

}

document.getElementById("noticeList").innerHTML=html;

}

function addNotice(){

let title=document.getElementById("title").value.trim();

let message=document.getElementById("message").value.trim();

if(title===""||message===""){

alert("Fill all fields");

return;

}

notices.unshift({

title:title,

message:message

});

localStorage.setItem("notices",JSON.stringify(notices));

document.getElementById("title").value="";

document.getElementById("message").value="";

showNotices();

}

function deleteNotice(index){

notices.splice(index,1);

localStorage.setItem("notices",JSON.stringify(notices));

showNotices();

}

showNotices();

</script>

</body>
</html>
