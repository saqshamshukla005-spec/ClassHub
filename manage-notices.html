<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

<style>

.notice-admin{

max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.notice-admin input,
.notice-admin textarea{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;

}

.notice-admin button{

background:#0d6efd;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;

}

.notice-card{

background:#f4f7fc;
padding:15px;
margin-top:20px;
border-radius:8px;

}

</style>

</head>


<body>


<header>

<h1>📢 Manage Notices</h1>

</header>



<div class="notice-admin">


<h2>Add New Notice</h2>


<input type="text" placeholder="Notice Title">


<textarea rows="5" placeholder="Write Notice"></textarea>


<button>

Add Notice

</button>



<div class="notice-card">

<h3>Example Notice</h3>

<p>Notice will appear here.</p>

</div>


</div>



</body>

</html>
