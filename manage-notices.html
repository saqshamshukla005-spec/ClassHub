<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Notices | ClassHub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📢 Manage Notices</h1>

</header>


<div class="notice-admin">

<h2>Add New Notice</h2>

<input id="title" type="text" placeholder="Notice Title">

<textarea id="message" rows="5" placeholder="Write Notice"></textarea>

<button onclick="addNotice()">
Add Notice
</button>


<h2>Added Notices</h2>

<div id="noticeList"></div>


</div>



<script>

function addNotice(){

let title=document.getElementById("title").value;

let message=document.getElementById("message").value;


if(title=="" || message==""){

alert("Please fill all details");

return;

}


let notices=JSON.parse(localStorage.getItem("notices")) || [];


notices.push({

title:title,

message:message

});


localStorage.setItem("notices",JSON.stringify(notices));


alert("Notice Added Successfully");


document.getElementById("title").value="";

document.getElementById("message").value="";


showNotices();

}



function showNotices(){

let notices=JSON.parse(localStorage.getItem("notices")) || [];

let list=document.getElementById("noticeList");


list.innerHTML="";


notices.forEach(n=>{


list.innerHTML += `

<div class="card">

<h3>${n.title}</h3>

<p>${n.message}</p>

</div>

`;


});


}


showNotices();


</script>


</body>

</html>
